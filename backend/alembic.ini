[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg2://barnamehsaz:change_me_local@localhost:5433/barnamehsaz_novin_dev

[log_level]
version = 3
formatters =
    default

handlers =
    console

root_logger = root
log_level = INFO

[formatters]
default =
    format = %%(levelname)-8s [%%(name)s] %%(message)s

[handlers]
console =
    class = StreamHandler
    args = (sys.stderr,)
    level = NOTSET
    formatter = default
    stream = ext::sys.stdout

[post_write_hooks]
hc = alembic_utils.hook:run_migrations
